server:
  port: ${PORT:8080}

spring:
  application:
    name: cyfrahub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cyfrahub}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CyfraHubHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  telegram:
    bot-username: ${TELEGRAM_BOT_USERNAME:CyfraHubBot}
    bot-token: ${TELEGRAM_BOT_TOKEN:5951537041:AAFpdvTLMSCwESlcMcj9N8A46hhBU7bm97A}
  commission:
    platform-fee-percent: 8.0 # 8% FunPay-like standard fee
