version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyfrahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyfrahub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyfrahub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyfrahub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyfrahub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/cyfrahub
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: 5951537041:AAFpdvTLMSCwESlcMcj9N8A46hhBU7bm97A
      TELEGRAM_BOT_USERNAME: CyfraHubBot
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyfrahub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: cyfrahub-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "backend:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
