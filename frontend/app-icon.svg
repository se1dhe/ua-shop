<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="16" opacity="0.4" filter="url(#glow)"/>

  <!-- CyfraHub Hexagon Shield -->
  <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linejoin="round"/>

  <!-- Stylized C / Digital Core -->
  <path d="M 310,200 A 70,70 0 1,0 310,312" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Energy Lightning bolt in the center -->
  <polygon points="266,170 220,260 256,260 240,340 292,246 256,246" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>
